[versions]
agp = "9.2.1"
kotlin = "2.4.21"
coreKtx = "1.19.0"
activityCompose = "1.13.0"
composeBom = "2026.09.00"
junit = "4.13.2"
# Versions freeRDPCore (FreeRDP 3.32.2) is built against; see android/scripts/build-freerdp.sh.
appcompat = "1.7.1"
androidxCore = "1.19.0"
preference = "1.2.1"
recyclerview = "1.4.0"
lifecycle = "2.11.0"
room = "2.8.4"
sqlcipher = "4.17.0"
sqlite = "2.7.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
freerdp-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
freerdp-core = { group = "androidx.core", name = "core", version.ref = "androidxCore" }
freerdp-preference = { group = "androidx.preference", name = "preference", version.ref = "preference" }
freerdp-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
freerdp-lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "lifecycle" }
freerdp-lifecycle-livedata = { group = "androidx.lifecycle", name = "lifecycle-livedata", version.ref = "lifecycle" }
freerdp-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
freerdp-sqlcipher = { group = "net.zetetic", name = "sqlcipher-android", version.ref = "sqlcipher" }
freerdp-sqlite = { group = "androidx.sqlite", name = "sqlite", version.ref = "sqlite" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
