name: CI

on:
  push:
  pull_request:

jobs:
  laptop:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: laptop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy src
      - name: Test
        run: pytest -q
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache-dependency-path: laptop/tailnet/go.sum
      - name: Build tailnet helper
        working-directory: laptop/tailnet
        run: go vet ./... && CGO_ENABLED=0 go build -trimpath -o tablink-tailnet .

  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # The RDP engine (FreeRDP, built from pinned source) only rebuilds when the script or
      # its patches change; otherwise it comes from the cache.
      - name: Cache FreeRDP library
        id: freerdp
        uses: actions/cache@v4
        with:
          path: android/app/libs/freeRDPCore-release.aar
          key: freerdp-${{ hashFiles('android/scripts/build-freerdp.sh', 'android/scripts/patches/**') }}
      - name: Build FreeRDP from source
        if: steps.freerdp.outputs.cache-hit != 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.13113456" "cmake;4.1.2" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
          ./scripts/build-freerdp.sh
      # Built-in Tailscale (tsnet) for the app, pinned by android/tsnet/go.mod + go.sum.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache-dependency-path: android/tsnet/go.sum
      - name: Build built-in Tailscale
        run: |
          v=$(cd tsnet && go list -m -f '{{.Version}}' golang.org/x/mobile)
          go install golang.org/x/mobile/cmd/gomobile@$v golang.org/x/mobile/cmd/gobind@$v
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.13113456" JAVA_HOME="$JAVA_HOME" ./scripts/build-tsnet.sh
      - name: Build and test
        run: ./gradlew assembleDebug test
